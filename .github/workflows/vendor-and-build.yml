name: vendor-and-build
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "vendor_snapshot/**"
      - "data/processed/**"
      - "vendor_manifest.json"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone upstreams and create local snapshots
        run: python scripts/vendor_sources.py
      - name: Build V2 master graph
        run: python scripts/build_v2.py
      - name: Commit snapshots and derived graph
        run: |
          git config user.name "epstein-network-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vendor_snapshot vendor_manifest.json data/processed || true
          git commit -m "Refresh vendored source snapshots and master graph" || exit 0
          git push
